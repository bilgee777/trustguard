# Phase 1: the web app only. The API and PostgreSQL services are added in phase 2.
services:
  web:
    build: ./web
    image: trustguard-web
    ports:
      - '127.0.0.1:8080:8080'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
