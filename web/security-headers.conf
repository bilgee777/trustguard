# Included in every location block: nginx drops inherited add_header directives
# as soon as a location defines its own, so server-level headers are not enough.
#
# connect-src 'none': the app makes no network requests in this version, so even an
# injected script could not exfiltrate pasted text. The script hash allows only the
# inline theme bootstrap in index.html.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' '__THEME_SCRIPT_HASH__'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
