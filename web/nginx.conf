# The browser only ever talks to this origin. Static files are served here and /api is forwarded to the API,
# so cookies are first-party, SameSite=Strict works, and no CORS configuration exists to get wrong.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Analysis requests are at most 10,000 characters of JSON. Anything bigger is rejected at the edge.
  client_max_body_size 64k;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # $http_host keeps the port the browser used. The API compares it with the request's Origin header
    # (CSRF defense), and $host would drop the port and make every request from localhost:8080 look foreign.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    # The API sets its own security headers (it serves JSON, never HTML), so the page CSP is not added here.
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Client-side routing: unknown paths fall back to the SPA shell.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
