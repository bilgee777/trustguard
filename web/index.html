<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TrustGuard checks suspicious messages and links for scam patterns and explains every warning sign it finds."
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#050a19" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f5fb" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TrustGuard: Think before you trust</title>
    <script>
      // Resolve the theme before first paint to avoid a light/dark flash.
      (function () {
        var mode = 'system';
        try {
          var saved = JSON.parse(localStorage.getItem('trustguard-theme') || 'null');
          if (saved && saved.state && saved.state.mode) mode = saved.state.mode;
        } catch (e) {}
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
